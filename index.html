<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Meu Repertório</title>
<meta name="description" content="Meu repertório de músicas e cifras, com transposição e diagramas de acordes, funcionando sem internet.">
<meta name="theme-color" content="#0B110E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Sistema visual do Meu Repertório: caderno noturno, dourado discreto e hierarquia clara. */
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage.woff2) format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jetbrains-mono.woff2) format('woff2');font-weight:100 800;font-display:swap}
:root{
  --bg:#F4F5F1;--surface:#FBFCF9;--surface-2:#E8EDE9;--ink:#17221D;--ink-2:#68766F;
  --line:#D7E0DA;--line-2:#B4C2B9;--accent:#98652F;--accent-ink:#FFF9F0;--accent-soft:#F1E4D0;
  --danger:#A94335;--overlay:rgba(5,10,7,.46);--shadow:0 12px 28px rgba(23,34,29,.08);
  --radius-sm:9px;--radius-md:13px;--radius-lg:18px;
  --font-ui:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B110E;--surface:#111B16;--surface-2:#18241D;--ink:#E8ECE8;--ink-2:#A3AEA7;
  --line:#26352C;--line-2:#3D4D43;--accent:#D9A85F;--accent-ink:#1B140A;--accent-soft:#332817;
  --danger:#E07868;--overlay:rgba(5,10,7,.58);--shadow:0 16px 38px rgba(0,0,0,.22);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B110E;--surface:#111B16;--surface-2:#18241D;--ink:#E8ECE8;--ink-2:#A3AEA7;
  --line:#26352C;--line-2:#3D4D43;--accent:#D9A85F;--accent-ink:#1B140A;--accent-soft:#332817;
  --danger:#E07868;--overlay:rgba(5,10,7,.58);--shadow:0 16px 38px rgba(0,0,0,.22);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-ui);font-synthesis:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap,.bar,.show-shell{max-width:940px;margin:0 auto}

/* barra superior */
#top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid transparent}
#top.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;gap:8px;min-height:46px}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font-weight:700;font-size:18px;line-height:1.15;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl span{display:block;font-size:12px;letter-spacing:.01em;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl:empty::before{content:"MR";display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid color-mix(in srgb,var(--accent) 70%,var(--line));border-radius:10px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em}
.ib{width:42px;height:42px;border-radius:var(--radius-sm);border:0;background:transparent;display:grid;place-items:center;transition:background-color .18s ease,color .18s ease,transform .18s ease}
.ib:hover{background:var(--surface-2);color:var(--accent)}
.ib:active{transform:translateY(1px) scale(.985)}
.btn{min-height:44px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .18s ease}
.btn:hover{background:var(--surface-2);border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,white)}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}

/* biblioteca */
h1.hd{font-size:clamp(34px,5.5vw,48px);line-height:.98;font-weight:800;letter-spacing:-.06em;margin:clamp(28px,5vw,48px) 0 8px}
h1.hd::before{content:"CADERNO DE CIFRAS";display:block;margin-bottom:13px;color:var(--accent);font-size:10px;line-height:1;font-weight:700;letter-spacing:.16em}
.sub{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14px;margin:0 0 25px}
.sub::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.tabs{display:flex;gap:0;margin:0 0 20px;border-bottom:1px solid var(--line)}
.tabs button{flex:0 0 auto;min-width:124px;min-height:46px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-2);font-weight:700;font-size:14px;transition:color .18s ease,border-color .18s ease}
.tabs button.on{border-bottom-color:var(--accent);color:var(--accent)}
.search{position:relative;margin-bottom:16px}
.search input{width:100%;height:50px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface-2);padding:0 14px 0 44px;transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease}
.search input:hover{border-color:var(--line-2)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.search .ic{position:absolute;left:14px;top:16px;color:var(--ink-2);pointer-events:none}
.songs{list-style:none;margin:0;padding:0}
ul.songs:not(.rep-list) li{border-bottom:1px solid var(--line)}
ul.songs:not(.rep-list) li:last-child{border-bottom:0}
ul.songs:not(.rep-list) a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;min-height:66px;padding:13px 8px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;transition:background-color .18s ease}
ul.songs:not(.rep-list) a:hover{background:var(--surface-2)}
ul.songs:not(.rep-list) a:active{background:var(--accent-soft)}
.songs .t{font-weight:700;font-size:18px;line-height:1.2;letter-spacing:-.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songs .a{grid-column:1;color:var(--ink-2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songs .k{grid-row:1/3;grid-column:2;justify-self:end;align-self:center;font:600 13px var(--font-mono);color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:5px 9px}
.songs .fav{display:inline-flex;align-items:center;margin-right:6px;vertical-align:-2px;color:var(--accent)}
.empty{padding:28px 4px;color:var(--ink-2)}
ul.songs:not(.rep-list) .empty{border-bottom:0}
.empty b{display:block;color:var(--ink);font-size:18px;letter-spacing:-.02em;margin-bottom:4px}
.empty span{display:block;max-width:46ch}

/* repertórios */
.rep-list{display:grid;gap:8px}
.rep-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);overflow:hidden;transition:border-color .18s ease,background-color .18s ease}
.rep-card:hover{border-color:var(--accent)}
.rep-card>a{min-width:0;padding:15px 8px 15px 16px;color:inherit;text-decoration:none}
.rep-card>a .t,.rep-card>a .a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-card>a .t{font-weight:700;font-size:18px;letter-spacing:-.025em}
.rep-card>a .a{margin-top:4px;color:var(--ink-2);font-size:14px}
.rep-actions{display:flex;align-items:center;gap:2px;padding-right:8px}
.rep-actions .ib{width:36px;height:36px;border-radius:8px}
.rep-play{min-height:34px;padding:0 12px;font-size:13px}
.rep-confirm{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:var(--accent-soft);font-size:13px}
.rep-confirm span{flex:1;min-width:140px}
.rep-editor{padding-bottom:40px}
.rep-section{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.rep-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rep-section h2{margin:0;font-size:19px;letter-spacing:-.02em}
.rep-section-head span{color:var(--ink-2);font-size:13px}
.rep-items,.rep-picker{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.rep-item{display:grid;grid-template-columns:28px 28px minmax(0,1fr) auto;align-items:center;gap:7px;padding:9px 8px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);transition:transform .15s ease,opacity .15s ease,box-shadow .15s ease}
.rep-item.dragging{opacity:.65;box-shadow:var(--shadow);transform:scale(1.01)}
.rep-handle{width:28px;height:38px;border:0;border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-size:18px;letter-spacing:-.3em;cursor:grab;touch-action:none}
.rep-handle:active{cursor:grabbing}
.rep-pos{font:700 14px var(--font-mono);color:var(--accent);text-align:center}
.rep-item-main{min-width:0}
.rep-item-main b,.rep-item-main small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-item-main b{font-size:15px}
.rep-item-main small{margin-top:3px;color:var(--ink-2);font-size:12px}
.rep-item.rep-removed{border-style:dashed;background:color-mix(in srgb,var(--surface-2) 58%,transparent)}
.rep-item.rep-removed .rep-item-main b{color:var(--danger)}
.rep-item-actions{display:flex;align-items:center;gap:1px;flex-wrap:wrap;justify-content:flex-end}
.rep-item-actions .ib{width:30px;height:30px;border-radius:8px}
.rep-picker{border-top:1px solid var(--line);gap:0;margin-top:12px}
.rep-picker li{border-bottom:1px solid var(--line)}
.rep-picker li:last-child{border-bottom:0}
.rep-pick{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 4px;cursor:pointer}
.rep-pick input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.rep-pick span{min-width:0;flex:1}
.rep-pick b,.rep-pick small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-pick small{margin-top:2px;color:var(--ink-2);font-size:12px}
.rep-pick em{font:600 13px var(--font-mono);color:var(--accent);font-style:normal}

/* dock de ações da biblioteca */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
.dock .in{max-width:640px;margin:0 auto;display:flex;gap:8px;padding:6px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface)}
.dock .btn{flex:1;min-height:50px;border-radius:var(--radius-sm)}

/* ferramentas da cifra */
.tools{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:19;background:var(--bg);margin:0 -16px;padding:7px 16px 8px}
.tools .in{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.seg{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);overflow:hidden}
.seg button{width:42px;height:42px;border:0;background:transparent;display:grid;place-items:center;transition:background-color .18s ease,color .18s ease}
.seg button:hover{background:var(--surface-2);color:var(--accent)}
.seg .tomv{width:auto;min-width:76px;padding:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.tomv small{font-size:10px;letter-spacing:.02em;color:var(--ink-2)}
.tomv b{font:700 17px var(--font-mono);color:var(--accent)}
.pill{height:42px;min-width:56px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13px;transition:background-color .18s ease,border-color .18s ease,color .18s ease}
.pill:hover{background:var(--surface-2);border-color:var(--accent);color:var(--accent)}
.pill:active{transform:translateY(1px) scale(.985)}
.grow{flex:1}
.speed{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--ink-2);padding:5px 0 2px}
.speed-label-min,.speed-label-max{font-size:11px;white-space:nowrap}
.speed input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:60px;height:6px;border-radius:3px;background:var(--line);outline:none;cursor:pointer}
.speed input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.speed input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.speed input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.speed input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
.speed input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.speed output{min-width:72px;text-align:right;font-weight:600;font-size:12px;color:var(--accent)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;margin:0 -16px;scrollbar-width:thin}
.strip .c{flex:none;width:auto;min-width:58px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:4px 6px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background-color .18s ease,border-color .18s ease}
.strip .c:hover{border-color:var(--accent);background:var(--accent-soft)}
.strip .c b{font:700 12px var(--font-mono);color:var(--accent);white-space:nowrap}
.strip .c svg{width:38px;height:46px}

/* cifra */
.song{font-family:var(--font-mono);overflow-x:auto;padding:6px 0 40px;font-size:var(--fs,14px);line-height:1.42;color:var(--ink);scrollbar-width:thin}
.sec{font:700 .78em var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:1.7em 0 .45em;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.pair,.cr,.ly,.lone{white-space:pre}
.pair{margin:0 0 .5em}
.cr{min-height:1.38em;color:var(--accent)}
.ch{color:var(--accent);font-weight:700;cursor:pointer;border-radius:4px;padding:0;background:none;border:0;font-family:inherit;font-size:inherit;line-height:inherit;text-underline-offset:3px}
.ch:hover,.ch.on{background:var(--accent-soft)}
.ch:focus-visible{outline:2px solid var(--accent);outline-offset:3px;background:var(--accent-soft)}
.lone.chl{margin:0 0 .5em}
.gap{height:.9em}
.note{color:var(--ink-2);font-style:italic}

/* diagrama de acorde */
.cd .gl{stroke:var(--line-2);stroke-width:1.2}
.cd .nut{stroke:var(--ink);stroke-width:4}
.cd .dot{fill:var(--accent)}
.cd .op{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.cd .mu{stroke:var(--ink-2);stroke-width:1.5;stroke-linecap:round}
.cd text{fill:var(--ink-2);font:600 11px var(--font-ui)}

/* cartão do acorde */
#cc{position:fixed;z-index:60;width:min(300px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:12px 14px 14px}
#cc.sheet{left:0;right:0;bottom:0;width:auto;max-width:560px;margin:0 auto;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#ccb{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.25)}
.cc-top{display:flex;align-items:baseline;gap:10px}
.cc-top strong{font:700 24px var(--font-mono);color:var(--accent)}
.cc-top span{flex:1;font-size:13px;color:var(--ink-2)}
.cc-close{width:36px;height:36px;border-radius:8px;flex:none;align-self:center}
.cc-main{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cc-fig svg{width:132px;height:156px}
#cc.sheet .cc-fig svg{width:150px;height:176px}
.cc-main .ib{width:48px;height:64px}
.cc-notes{text-align:center;font-size:13px;color:var(--ink-2);min-height:19px}
.cc-all{display:flex;gap:6px;overflow-x:auto;padding-top:8px;justify-content:center}
.cc-all button{flex:none;border:1px solid var(--line);background:transparent;border-radius:10px;padding:3px}
.cc-all button.on{border-color:var(--accent);background:var(--accent-soft)}
.cc-all svg{width:34px;height:40px;display:block}

/* editor */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-2)}
.field input{height:46px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);padding:0 12px;min-width:0;transition:border-color .18s ease,box-shadow .18s ease}
.field input:hover{border-color:var(--line-2)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row3{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}
@media(min-width:560px){.row3{grid-template-columns:2fr 2fr 1fr}}
textarea.body{width:100%;min-height:46vh;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);padding:12px;font:400 13px/1.4 var(--font-mono);white-space:pre;overflow:auto;resize:vertical;transition:border-color .18s ease,box-shadow .18s ease}
textarea.body:hover{border-color:var(--line-2)}
textarea.body:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--danger);font-size:13px;min-height:18px}
.hint{color:var(--ink-2);font-size:14px;margin:6px 0 12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.rep{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;margin:10px 0}
.prev{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
.prev h2{font-size:13px;color:var(--ink-2);margin:10px 0 0;font-weight:600}

/* bottom sheet e menus */
.sheetb{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:transparent;pointer-events:none}
.sheetb.sheet-open{pointer-events:auto}
.sheet-backdrop{position:fixed;inset:0;z-index:0;background:var(--overlay);opacity:0}
.shd{position:relative;z-index:1;width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.16);padding:8px 8px calc(12px + env(safe-area-inset-bottom,0px));max-height:min(82dvh,680px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.shd-handle{display:flex;justify-content:center;padding:6px 0 4px}
.shd-handle::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line-2);opacity:.6}
.shd h3{margin:10px 12px 4px;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.shd button{width:100%;display:flex;align-items:center;gap:14px;text-align:left;min-height:50px;padding:0 12px;border:0;background:transparent;border-radius:var(--radius-sm);font-weight:500}
.shd button:hover{background:var(--surface-2);color:var(--accent)}
.shd button:active{background:var(--accent-soft)}
.shd button>small{margin-left:auto;color:var(--ink-2)}
.shd input{height:46px;margin:8px 12px 12px;width:calc(100% - 24px);border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);padding:0 12px}
.shd p{margin:8px 12px 12px;color:var(--ink-2);font-size:14px}
.setting-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;min-height:52px;padding:4px 12px;border:0;background:transparent;border-radius:var(--radius-sm);font-weight:500;cursor:pointer}
.setting-row .ic{color:var(--ink-2)}
.setting-label{flex:1;min-width:0}
.setting-label small{display:block;margin-top:2px;font-size:12px;color:var(--ink-2);font-weight:400}
.font-size-row{display:flex;align-items:center;gap:8px;padding:4px 12px 12px}
.shd .font-size-row .seg button{width:40px;height:40px;padding:0;justify-content:center}
.font-size-row .seg{flex:none}
.font-size-row .fsval{min-width:62px;text-align:center;font:700 13px var(--font-mono);color:var(--accent)}
.shd .font-size-row .btn{width:auto;flex:1;min-height:40px;justify-content:center;padding:0 12px;gap:6px}

/* switch */
.switch{position:relative;display:inline-flex;width:40px;height:24px;border-radius:12px;background:var(--line-2);flex:none;transition:background-color .22s ease}
.switch>span{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .22s ease,box-shadow .22s ease}
.switch.on{background:var(--accent)}
.switch.on>span{transform:translateX(16px);box-shadow:0 1px 6px rgba(0,0,0,.22)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:11px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;max-width:calc(100vw - 32px);box-shadow:var(--shadow);pointer-events:none;text-align:center;line-height:1.35}
#toast.toast-error{border-color:var(--danger);color:var(--danger)}
#toast.toast-success{border-left:3px solid var(--accent)}
@media(prefers-reduced-motion:no-preference){
  #toast{opacity:0;transform:translate(-50%,8px);transition:opacity .22s ease,transform .22s ease}
  #toast.toast-in{opacity:1;transform:translate(-50%,0)}
  #toast.toast-out{opacity:0;transform:translate(-50%,-4px)}
  .sheet-backdrop{transition:opacity .28s ease}
  .sheetb.sheet-open .sheet-backdrop{opacity:1}
  .shd{transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.68,.31,1)}
  .sheetb.sheet-open .shd{transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){
  #toast{transform:translateX(-50%)}
  .sheet-backdrop{opacity:0}
  .sheetb.sheet-open .sheet-backdrop{opacity:1}
  .shd{transform:none}
  .switch>span,.switch{transition:none}
}

/* modo show */
.show-mode{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.show-shell{max-width:940px;margin:0 auto}
.show-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:52px;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.show-spacer{flex:1}
.show-quiet{min-height:44px;max-width:48%;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .18s ease,background-color .18s ease,color .18s ease}
.show-quiet:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.show-song{padding-top:18px;padding-bottom:144px}
.show-nav{position:fixed;left:0;right:0;bottom:0;z-index:18;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.show-nav strong{min-width:58px;text-align:center;color:var(--accent);font:700 13px var(--font-mono)}
.show-nav-btn{min-width:0;min-height:58px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);text-align:left;overflow:hidden;transition:border-color .18s ease,background-color .18s ease}
.show-nav-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.show-nav-btn:disabled{opacity:.45;cursor:default}
.show-nav-btn span,.show-nav-btn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.show-nav-btn span{color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.show-nav-btn b{margin-top:3px;font-size:13px}
body.show-mode .song{overflow-x:auto}

/* leitura: o texto ocupa o palco; os controles ficam compactos */
body.reading-mode{padding-bottom:28px}
body.reading-mode #top{padding-top:calc(5px + env(safe-area-inset-top,0px));padding-bottom:5px}
body.reading-mode #top .bar{min-height:42px;gap:3px}
body.reading-mode #top .ttl b{font-size:16px;letter-spacing:-.025em}
body.reading-mode #top .ttl span{font-size:12px}
body.reading-mode #top .ib{width:38px;height:38px}
body.reading-mode .tools{top:calc(52px + env(safe-area-inset-top,0px));padding-top:3px;padding-bottom:5px;border-bottom:1px solid var(--line)}
body.reading-mode .tools .in{gap:6px}
body.reading-mode .seg{height:38px}
body.reading-mode .seg button{width:36px;height:36px}
body.reading-mode .seg .tomv{min-width:70px;padding:0 5px}
body.reading-mode .tomv small{font-size:10px}
body.reading-mode .tomv b{font-size:16px}
body.reading-mode .tools .pill{height:38px;min-width:38px;padding:0 10px;font-size:12px}
body.reading-mode .tools .pill[data-act="scroll"]{width:38px;padding:0;font-size:0}
body.reading-mode .tools .pill[data-act="scroll"] .ic{width:17px;height:17px}
body.reading-mode .speed{padding-top:4px;font-size:12px}
body.reading-mode #stripwrap:empty{display:none}
body.reading-mode .strip{max-width:940px;margin:0 auto;padding-top:4px;padding-bottom:8px}
body.reading-mode .strip .c{width:auto;min-width:56px;padding:4px 6px 3px}
body.reading-mode .strip .c svg{width:36px;height:44px}
body.reading-mode .song{max-width:940px;margin:0 auto;padding:18px 0 42px;line-height:1.48;scroll-padding-top:120px}
body.reading-mode .pair{margin-bottom:.68em}
body.reading-mode .cr{min-height:1.45em}
body.reading-mode .gap{height:1.12em}
body.reading-mode .sec{margin-top:1.55em;margin-bottom:.5em;font-size:.76em}
body.reading-mode #sheet .shd{max-height:min(78dvh,620px);overflow:auto}

@media(min-width:700px){
  ul.songs:not(.rep-list){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}
  .dock .in{max-width:640px}
}
@media(max-width:560px){
  h1.hd{font-size:clamp(34px,11vw,44px);margin-top:28px}
  .tabs button{min-width:50%;padding:0 10px}
  .rep-card{grid-template-columns:minmax(0,1fr)}
  .rep-card>a{padding:14px 14px 8px}
  .rep-actions{justify-content:flex-end;padding:0 10px 10px;border-top:1px solid var(--line);padding-top:8px}
  .rep-play{margin-right:auto}
  .rep-item{grid-template-columns:28px 24px minmax(0,1fr)}
  .rep-item-actions{grid-column:3;justify-content:flex-start}
  .rep-pick em{font-size:12px}
  .dock .btn{font-size:14px;padding:0 9px}
  .show-controls{gap:5px}
  .show-quiet{padding:0 9px;font-size:12px}
  .show-nav{gap:5px;padding-left:8px;padding-right:8px}
  .show-nav-btn{padding-left:7px;padding-right:7px;min-height:56px}
  .show-nav strong{min-width:48px;font-size:12px}
  body.reading-mode .song{padding-top:14px;padding-bottom:30px;line-height:1.5}
  body.reading-mode .tools .in{gap:5px}
}
@media(max-width:380px){
  .speed-label-min,.speed-label-max{display:none}
  .speed output{min-width:58px}
  .dock .btn{font-size:13px;padding:0 8px;gap:6px;white-space:nowrap}
  .dock .btn svg{width:17px;height:17px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="top"></div>
<main class="wrap" id="view"></main>

<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="pick" multiple accept=".pdf,.txt,.json,application/pdf,text/plain,application/json" hidden>
<script src="music-parser.js"></script>
<script src="engine.js"></script>
<script src="seed.js"></script>
<script src="vendor/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase-sync.js"></script>
<script src="app.js"></script>
</body>
