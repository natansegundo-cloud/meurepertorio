<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Meu Repertório</title>
<meta name="description" content="Meu repertório de músicas e cifras, com transposição e diagramas de acordes, funcionando sem internet.">
<meta name="theme-color" content="#EFF2F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Caderno de Cifras: caderno de violão de bolso. Cifra em mono, acordes na cor de destaque, diagramas no braço. */
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage.woff2) format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jetbrains-mono.woff2) format('woff2');font-weight:100 800;font-display:swap}
:root{
  --bg:#EFF2F0;--surface:#FFFFFF;--surface-2:#E5EAE7;--ink:#13201D;--ink-2:#556661;--line:#D3DBD7;--line-2:#AEBBB6;
  --accent:#3347E8;--accent-ink:#FFFFFF;--accent-soft:#E2E6FD;--danger:#B3261E;
  --font-ui:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --shadow:0 10px 30px rgba(19,32,29,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1311;--surface:#151D1B;--surface-2:#1E2926;--ink:#E6EEEA;--ink-2:#9AACA5;--line:#27332F;--line-2:#42524D;
  --accent:#93A2FF;--accent-ink:#0D1311;--accent-soft:#232B55;--danger:#FF8A80;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311;--surface:#151D1B;--surface-2:#1E2926;--ink:#E6EEEA;--ink-2:#9AACA5;--line:#27332F;--line-2:#42524D;
  --accent:#93A2FF;--accent-ink:#0D1311;--accent-soft:#232B55;--danger:#FF8A80;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-ui);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:820px;margin:0 auto}

/* barra superior */
#top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid transparent}
#top.scrolled{border-bottom-color:var(--line)}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:44px}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font-weight:700;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center}
.ib:hover{background:var(--surface-2)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}

/* biblioteca */
h1.hd{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:18px 0 4px}
.sub{color:var(--ink-2);font-size:14px;margin:0 0 16px}
.search{position:relative;margin-bottom:8px}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px 0 42px}
.search .ic{position:absolute;left:13px;top:14px;color:var(--ink-2)}
.songs{list-style:none;margin:0;padding:0}
.songs a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.songs a:hover .t{color:var(--accent)}
.songs .t{font-weight:700;font-size:18px;line-height:1.2}
.songs .a{grid-column:1;color:var(--ink-2);font-size:14px}
.songs .k{grid-row:1/3;grid-column:2;font:600 13px var(--font-mono);color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 9px}
.empty{padding:36px 0;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .in{max-width:820px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}

/* cifra */
.tools{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:19;background:var(--bg);margin:0 -16px;padding:4px 16px 8px}
.tools .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);overflow:hidden}
.seg button{width:42px;height:42px;border:0;background:transparent;display:grid;place-items:center}
.seg button:hover{background:var(--surface-2)}
.seg .tomv{width:auto;min-width:76px;padding:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.tomv small{font-size:11px;color:var(--ink-2)}
.tomv b{font:700 17px var(--font-mono);color:var(--accent)}
.pill{height:42px;min-width:56px;padding:0 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:700}
.grow{flex:1}
.speed{display:flex;align-items:center;gap:10px;width:100%;font-size:13px;color:var(--ink-2)}
.speed input{flex:1;accent-color:var(--accent)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:thin}
.strip .c{flex:none;width:64px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.strip .c:hover{border-color:var(--accent)}
.strip .c b{font:700 13px var(--font-mono);color:var(--accent)}
.strip .c svg{width:44px;height:52px}
.song{font-family:var(--font-mono);overflow-x:auto;padding:6px 0 40px;font-size:var(--fs,14px);line-height:1.38;scrollbar-width:thin}
.sec{font:700 .78em var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:1.5em 0 .4em;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.pair,.cr,.ly,.lone{white-space:pre}
.pair{margin:0 0 .5em}
.cr{min-height:1.38em}
.ch{color:var(--accent);font-weight:700;cursor:pointer;border-radius:4px;padding:0;background:none;border:0;font-family:inherit;font-size:inherit;line-height:inherit;text-underline-offset:3px}
.ch:hover,.ch.on{background:var(--accent-soft)}
.lone.chl{margin:0 0 .5em}
.gap{height:.9em}
.note{color:var(--ink-2);font-style:italic}

/* diagrama */
.cd .gl{stroke:var(--line-2);stroke-width:1.2}
.cd .nut{stroke:var(--ink);stroke-width:4}
.cd .dot{fill:var(--accent)}
.cd .op{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.cd .mu{stroke:var(--ink-2);stroke-width:1.5;stroke-linecap:round}
.cd text{fill:var(--ink-2);font:600 11px var(--font-ui)}

/* cartão do acorde */
#cc{position:fixed;z-index:60;width:min(330px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 14px}
#cc.sheet{left:0;right:0;bottom:0;width:auto;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#ccb{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.25)}
.cc-top{display:flex;align-items:baseline;gap:10px}
.cc-top strong{font:700 24px var(--font-mono);color:var(--accent)}
.cc-top span{flex:1;font-size:13px;color:var(--ink-2)}
.cc-main{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cc-fig svg{width:150px;height:177px}
#cc.sheet .cc-fig svg{width:170px;height:200px}
.cc-main .ib{width:48px;height:64px}
.cc-notes{text-align:center;font-size:13px;color:var(--ink-2);min-height:19px}
.cc-all{display:flex;gap:6px;overflow-x:auto;padding-top:8px;justify-content:center}
.cc-all button{flex:none;border:1px solid var(--line);background:transparent;border-radius:10px;padding:3px}
.cc-all button.on{border-color:var(--accent);background:var(--accent-soft)}
.cc-all svg{width:34px;height:40px;display:block}

/* editor */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input{height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;min-width:0}
.row3{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}
@media(min-width:560px){.row3{grid-template-columns:2fr 2fr 1fr}}
textarea.body{width:100%;min-height:46vh;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:12px;font:400 13px/1.4 var(--font-mono);white-space:pre;overflow:auto;resize:vertical}
.err{color:var(--danger);font-size:13px;min-height:18px}
.hint{color:var(--ink-2);font-size:14px;margin:6px 0 12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.rep{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.prev{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
.prev h2{font-size:14px;color:var(--ink-2);margin:10px 0 0;font-weight:600}

/* menus */
.sheetb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.shd{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.shd h3{margin:10px 12px 4px;font-size:13px;color:var(--ink-2);font-weight:600}
.shd button{width:100%;display:flex;align-items:center;gap:14px;text-align:left;min-height:52px;padding:0 12px;border:0;background:transparent;border-radius:12px;font-weight:500}
.shd button:hover{background:var(--surface-2)}
.shd button small{margin-left:auto;color:var(--ink-2)}
.shd input{height:46px;margin:8px 12px 12px;width:calc(100% - 24px);border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px}
.shd p{margin:8px 12px 12px;color:var(--ink-2);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){#toast{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,6px)}}}
</style>
<style>
/* Direção visual: palco escuro, papel quente e um único acento dourado. */
:root{
  --bg:#F3F4F0;--surface:#FFFFFF;--surface-2:#E8ECE8;--ink:#18231F;--ink-2:#66766F;--line:#D6DED9;--line-2:#B5C2BB;
  --accent:#A76732;--accent-ink:#FFF9F0;--accent-soft:#F2E4D4;
  --shadow:0 18px 48px rgba(24,35,31,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09100D;--surface:#111A16;--surface-2:#19241F;--ink:#EDF2ED;--ink-2:#A2B2A8;--line:#26352E;--line-2:#405149;
  --accent:#D8AA67;--accent-ink:#17130D;--accent-soft:#352A1B;
  --shadow:0 20px 55px rgba(0,0,0,.34);
}}
:root[data-theme="dark"]{
  --bg:#09100D;--surface:#111A16;--surface-2:#19241F;--ink:#EDF2ED;--ink-2:#A2B2A8;--line:#26352E;--line-2:#405149;
  --accent:#D8AA67;--accent-ink:#17130D;--accent-soft:#352A1B;
  --shadow:0 20px 55px rgba(0,0,0,.34);
}
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at 50% -12rem,rgba(216,170,103,.12),transparent 34rem),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;background-image:radial-gradient(rgba(255,255,255,.08) .6px,transparent .6px);background-size:5px 5px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 70%)}
.wrap{max-width:900px}
#top{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
#top.scrolled{border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}
.bar{max-width:900px;min-height:48px}
.bar .ttl b{letter-spacing:-.03em}
.bar .ttl:empty::before{content:"MR";display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid color-mix(in srgb,var(--accent) 70%,var(--line));border-radius:10px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em}
.ib,.btn,.pill,.seg button,.songs a,.search input,.field input,textarea.body,.strip .c,.shd button{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease}
.ib{border-radius:14px}
.ib:hover{background:var(--surface-2);transform:translateY(-1px)}
.ib:active,.btn:active,.pill:active,.seg button:active,.shd button:active{transform:scale(.97)}
.btn{border-radius:14px;box-shadow:0 2px 0 color-mix(in srgb,var(--line-2) 45%,transparent)}
.btn:hover{border-color:var(--accent);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 14%,transparent);transform:translateY(-1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 24%,transparent)}
.btn.pri:hover{filter:none;background:color-mix(in srgb,var(--accent) 88%,white);color:var(--accent-ink)}
h1.hd{font-size:clamp(38px,6vw,54px);line-height:.98;letter-spacing:-.055em;margin:clamp(42px,8vw,76px) 0 8px;text-wrap:balance}
h1.hd::before{content:"BIBLIOTECA";display:block;margin-bottom:14px;color:var(--accent);font-size:11px;line-height:1;font-weight:700;letter-spacing:.18em}
.sub{display:flex;align-items:center;gap:8px;margin-bottom:24px;font-size:15px}
.sub::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search{margin-bottom:18px}
.search input{height:58px;border-radius:16px;border-color:var(--line);background:color-mix(in srgb,var(--surface) 84%,transparent);padding-left:48px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 12px 30px rgba(0,0,0,.06)}
.search input:hover,.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent),inset 0 1px 0 rgba(255,255,255,.04)}
.search .ic{left:16px;top:19px;color:var(--accent)}
.songs{display:grid;gap:10px}
.songs a{position:relative;min-height:78px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--surface) 90%,transparent);box-shadow:0 6px 20px rgba(0,0,0,.04)}
.songs a::after{content:"↗";position:absolute;right:18px;bottom:13px;color:var(--ink-2);font-size:13px;opacity:0;transform:translate(-4px,4px);transition:opacity .2s ease,transform .2s ease}
.songs a:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:var(--surface);box-shadow:0 12px 28px color-mix(in srgb,var(--accent) 10%,transparent);transform:translateY(-2px)}
.songs a:hover::after{opacity:1;transform:translate(0,0)}
.songs a:active{transform:translateY(0)}
.songs .t{font-size:19px;letter-spacing:-.025em}
.songs .a{font-size:14px;margin-top:3px}
.songs .k{margin-right:20px;border-radius:9px;padding:6px 10px;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent)}
.empty{padding:28px 22px;border:1px dashed var(--line-2);border-radius:16px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.empty b{font-size:19px;letter-spacing:-.02em}
.dock{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 68%,transparent)}
.dock .in{gap:10px;padding:7px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--surface) 88%,transparent);box-shadow:0 16px 38px rgba(0,0,0,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dock .btn{min-height:52px;border-radius:14px}
.tools{background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg,.pill,.strip .c{box-shadow:0 4px 16px rgba(0,0,0,.05)}
.seg,.pill{border-color:var(--line)}
.pill:hover,.seg button:hover,.strip .c:hover{border-color:var(--accent);background:var(--accent-soft)}
.strip .c{border-color:var(--line);border-radius:14px}
.strip .c b,.tomv b,.ch{color:var(--accent)}
.shd{border:1px solid var(--line);border-bottom:0;box-shadow:0 -18px 50px rgba(0,0,0,.22)}
.shd h3{letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.shd button:hover{background:var(--surface-2);color:var(--accent)}
.field input:focus,textarea.body:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
@media(min-width:700px){
  .songs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dock .in{max-width:900px}
}
@media(max-width:560px){
  h1.hd{margin-top:34px}
  .songs a{min-height:72px;padding:14px 15px}
  .dock .btn{font-size:15px;padding:0 10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="top"></div>
<main class="wrap" id="view"></main>
<div id="dock" class="dock" hidden></div>
<div id="ccb" hidden></div>
<div id="cc" hidden role="dialog" aria-label="Diagrama do acorde"></div>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="pick" multiple accept=".pdf,.txt,.json,application/pdf,text/plain,application/json" hidden>
<script src="engine.js"></script>
<script src="seed.js"></script>
<script src="vendor/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase-sync.js"></script>
<script src="app.js"></script>
</body>
</html>
